version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: receptionist-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: receptionist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receptionist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: receptionist-backend
    environment:
      DATABASE_URL: "postgresql://postgres:${DB_PASSWORD}@postgres:5432/receptionist?schema=public"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CALENDAR_ENCRYPTION_SECRET: ${CALENDAR_ENCRYPTION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  voice-server:
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
    container_name: receptionist-voice-server
    environment:
      PORT: 5000
      NODE_ENV: production
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_MEDIA_STREAM_URL: ${TWILIO_MEDIA_STREAM_URL}
      TWILIO_SILENCE_THRESHOLD_DB: "-45"
      TWILIO_SILENCE_DURATION_MS: "2000"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: receptionist-frontend

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: receptionist-proxy
    ports:
      - "80:80"
    depends_on:
      - backend
      - voice-server
      - frontend

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: receptionist-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - voice-server

volumes:
  postgres_data:
