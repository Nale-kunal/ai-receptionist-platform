version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: receptionist-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: receptionist_secret_password
      POSTGRES_DB: receptionist
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d receptionist"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: receptionist-backend
    environment:
      DATABASE_URL: "postgresql://postgres:receptionist_secret_password@postgres:5432/receptionist?schema=public"
      JWT_ACCESS_SECRET: "development-only-access-secret-32-chars-long"
      JWT_REFRESH_SECRET: "development-only-refresh-secret-32-chars-long"
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: "*"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  voice-server:
    build:
      context: .
      dockerfile: docker/voice/Dockerfile
    container_name: receptionist-voice-server
    environment:
      PORT: 5000
      NODE_ENV: production
      TWILIO_ACCOUNT_SID: "ACmockaccountxxxxxxxxxxxxxxxxxxxx"
      TWILIO_AUTH_TOKEN: "mockauthtokenxxxxxxxxxxxxxxxxxxx"
      TWILIO_MEDIA_STREAM_URL: "wss://localhost/voice-stream"
      TWILIO_SILENCE_THRESHOLD_DB: "-45"
      TWILIO_SILENCE_DURATION_MS: "2000"
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: receptionist-frontend

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: receptionist-proxy
    ports:
      - "80:80"
    depends_on:
      - backend
      - voice-server
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: receptionist-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend
      - voice-server

volumes:
  postgres_data:
